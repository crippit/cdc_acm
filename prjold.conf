# --- Core System ---
CONFIG_LOG=y
CONFIG_PRINTK=y

# --- Memory Allocation (The Missing Pillars) ---
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_HCI_TX_STACK_SIZE_WITH_PROMPT=y
CONFIG_BT_HCI_TX_STACK_SIZE=4096

# --- Base Bluetooth Support ---
CONFIG_BT=y
CONFIG_BT_HCI=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_PER_ADV=y
CONFIG_BT_ISO_BROADCASTER=y
CONFIG_BT_AUDIO=y
CONFIG_BT_BAP_BROADCAST_SOURCE=y
CONFIG_BT_DEVICE_NAME="Zip Captions Auracaster"

# --- Bluetooth Buffers ---
CONFIG_BT_BUF_ISO_TX_COUNT=6
CONFIG_BT_BUF_ISO_TX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_ACL_TX_SIZE=251

# --- USB Device (Classic) ---
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USB_DEVICE_AUDIO=y
CONFIG_USB_COMPOSITE_DEVICE=y
CONFIG_NET_BUF=y

# --- USB Branding ---
CONFIG_USB_DEVICE_PRODUCT="Zip Captions Auracaster"
CONFIG_USB_DEVICE_MANUFACTURER="Zip Solutions"
CONFIG_USB_DEVICE_VID=0x1111
CONFIG_USB_DEVICE_PID=0xAAAB

# --- I2S Driver ---
CONFIG_I2S=y
CONFIG_I2S_NRFX=y