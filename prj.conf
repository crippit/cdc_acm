# --- Core Log & Debug ---
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y

# --- System Memory & Thread Buffers ---
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_NET_BUF=y

# --- Dual-Core IPC ---
CONFIG_MBOX=y
CONFIG_IPC_SERVICE=y
CONFIG_IPC_SERVICE_BACKEND_RPMSG_WQ_STACK_SIZE=4096

# --- Legacy USB Stack & Branding ---
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_AUDIO=y
CONFIG_USB_COMPOSITE_DEVICE=y
CONFIG_USB_DEVICE_VID=0x1111
CONFIG_USB_DEVICE_PID=0xAAAC
CONFIG_USB_DEVICE_MANUFACTURER="Zip Solutions"
CONFIG_USB_DEVICE_PRODUCT="Zip Captions Auracaster"

# --- Hardware Drivers ---
CONFIG_I2C=y
CONFIG_I2S=y
CONFIG_I2S_NRFX=y
CONFIG_GPIO=y

# --- Bluetooth Base Stack ---
CONFIG_BT=y
CONFIG_UTF8=y
CONFIG_BT_EXT_ADV=y
CONFIG_BT_PER_ADV=y
CONFIG_BT_ISO_BROADCASTER=y

# --- Auracast / BAP Audio Stack ---
CONFIG_BT_AUDIO=y
CONFIG_BT_BAP_BROADCAST_SOURCE=y
CONFIG_BT_AUDIO_CODEC_CFG_MAX_DATA_SIZE=155
CONFIG_BT_AUDIO_CODEC_CAP_MAX_DATA_SIZE=120
CONFIG_BT_DEVICE_NAME="Zip Captions"
CONFIG_BT_BAP_BROADCAST_SRC_STREAM_COUNT=2
CONFIG_BT_ISO_MAX_CHAN=2

# Fix the BAP buffer overflow (make room for the "Zip Captions" string)
CONFIG_BT_AUDIO_CODEC_CFG_MAX_METADATA_SIZE=255

# Public Broadcast Profile (Strict Auracast Requirement)
CONFIG_BT_PBP=y

# --- Expanded Bridge Buffers for Audio Commands ---
CONFIG_BT_BUF_CMD_TX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251

# --- The Math Engine (LC3 Codec) ---
CONFIG_FPU=y
CONFIG_LIBLC3=y

# --- The Isochronous (ISO) Radio Buffers (Host side) ---
# Aligned with expert recommendations to prevent Android BIG sync failures
CONFIG_BT_ISO_TX_BUF_COUNT=3
CONFIG_BT_ISO_TX_MTU=251

# --- Bluetooth Stack Deep Logging ---
CONFIG_BT_LOG_LEVEL_INF=y
CONFIG_BT_HCI_CORE_LOG_LEVEL_INF=y
CONFIG_BT_ISO_LOG_LEVEL_DBG=y
CONFIG_BT_BAP_BROADCAST_SOURCE_LOG_LEVEL_DBG=y
CONFIG_BT_BAP_STREAM_LOG_LEVEL_DBG=y
CONFIG_BT_AUDIO_LOG_LEVEL_DBG=y